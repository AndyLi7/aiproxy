name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
    paths-ignore:
      - "**/*.md"
      - "**/*.yaml"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "**/*.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-aiproxy:
    name: Test AI Proxy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "core/go.mod"

      - name: Image API contract gate
        run: sh core/scripts/test-image-contracts.sh

      - name: Go test
        working-directory: core
        run: |
          # The controller/model suites include concurrency and database matrices.
          # Keep all cases; bound each package independently from job duration.
          go test -v -timeout 600s -count=1 ./...

  golangci-lint-aiproxy:
    name: Lint AI Proxy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "core/go.mod"

      - name: Run Linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          working-directory: core
          # Keep every finding without overflowing the action's stdout buffer.
          args: >-
            --path-mode=abs --output.text.path=../lint-core.txt
            --output.json.path=../lint-core.json --output.text.colors=false

      - name: Upload full lint diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lint-core-${{ github.event_name }}
          path: |
            lint-core.txt
            lint-core.json
          if-no-files-found: warn
          retention-days: 7

  test-mcpservers:
    name: Test MCP Servers
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "mcp-servers/go.mod"

      - name: Go test
        working-directory: mcp-servers
        run: |
          go test -v -timeout 60s -count=1 ./...

  golangci-lint-mcpservers:
    name: Lint MCP Servers
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "mcp-servers/go.mod"

      - name: Run Linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          working-directory: mcp-servers
          args: --color=always --path-mode=abs

      - name: Run Fix Linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        if: ${{ failure() }}
        with:
          install-mode: none
          working-directory: mcp-servers
          args: --fix --color=always --path-mode=abs

      - name: Auto Fix Diff Content
        if: ${{ failure() }}
        run: |
          if git diff --exit-code --color=always; then
            echo "No changes detected after auto-fix"
          else
            git diff --color=always
            exit 1
          fi

  golangci-lint-openapimcp:
    name: Lint OpneAPI MCP
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: "openapi-mcp/go.mod"

      - name: Run Linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          working-directory: openapi-mcp
          args: --color=always --path-mode=abs

      - name: Run Fix Linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        if: ${{ failure() }}
        with:
          install-mode: none
          working-directory: openapi-mcp
          args: --fix --color=always --path-mode=abs

      - name: Auto Fix Diff Content
        if: ${{ failure() }}
        run: |
          if git diff --exit-code --color=always; then
            echo "No changes detected after auto-fix"
          else
            git diff --color=always
            exit 1
          fi
